name: Ticket fix

# Started by the super admin pressing "Fix it" in the app. The app sends a repository_dispatch event that carries only
# ids. Everything else is fetched from the app over a signed request, so ticket text never travels through GitHub.
on:
  repository_dispatch:
    types: [ticket-fix]

concurrency:
  group: ticket-fix-${{ github.event.client_payload.ticket_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Fix the ticket
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TICKET_WEBHOOK_SECRET: ${{ secrets.TICKET_WEBHOOK_SECRET }}
          GH_TOKEN: ${{ github.token }}
          TICKET_ID: ${{ github.event.client_payload.ticket_id }}
          TICKET_REF: ${{ github.event.client_payload.ref }}
          ATTEMPT: ${{ github.event.client_payload.attempt }}
          APP_URL: ${{ github.event.client_payload.app_url }}
          TARGET_BRANCH: ${{ github.event.client_payload.target_branch || 'dev' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ticket-fix/run.js
