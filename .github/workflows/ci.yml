name: CI

# Runs the tests and a dependency check on every push and pull request.
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Tests
        run: npm test
        env:
          DATABASE_URL: ''
          ANTHROPIC_API_KEY: ''
      - name: Dependency check
        run: npm audit --omit=dev --audit-level=critical

  # Looks for keys and passwords in the files and in every commit. A key that was ever committed counts as leaked.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Secret scan
        run: node scripts/secret-scan.js --history
