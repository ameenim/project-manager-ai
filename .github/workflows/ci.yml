name: CI

# Runs the tests and a dependency check on every push and pull request.
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Tests
        run: npm test
        env:
          DATABASE_URL: ''
          ANTHROPIC_API_KEY: ''
      - name: Dependency check
        run: npm audit --omit=dev --audit-level=critical
